<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Command Center — clipboard command palette for MSP/field techs. Copy, never execute." />
    <title>Command Center</title>
    <script>
      (function () {
        var theme = "system";
        var scroll = "system";
        var density = "comfortable";
        try {
          var raw = localStorage.getItem("command-center:document");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && (parsed.theme === "light" || parsed.theme === "dark" || parsed.theme === "system")) {
              theme = parsed.theme;
            }
            if (
              parsed &&
              (parsed.scrollMotion === "smooth" ||
                parsed.scrollMotion === "instant" ||
                parsed.scrollMotion === "system")
            ) {
              scroll = parsed.scrollMotion;
            }
            if (parsed && (parsed.listDensity === "compact" || parsed.listDensity === "comfortable")) {
              density = parsed.listDensity;
            }
          }
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var behavior =
          scroll === "instant" ? "auto" : scroll === "smooth" ? "smooth" : reduced ? "auto" : "smooth";
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.themePref = theme;
        root.dataset.scroll = scroll;
        root.dataset.scrollBehavior = behavior;
        root.dataset.density = density;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
