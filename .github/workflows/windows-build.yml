name: Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to attach artifacts to (e.g. v0.1.0)
        required: false
        type: string
        default: v0.1.0
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Tag-push uses github.ref_name (v0.1.0). workflow_dispatch uses the tag input
      # so portable zips can be attached to an existing release without retagging.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || 'v0.1.0') || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: npm ci
      - name: Generate icons
        run: |
          python -m pip install --user pillow
          python scripts/generate-icons.py
      - name: Test
        run: npm test
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Command Center ${{ env.RELEASE_TAG }}"
          releaseDraft: false
          includeUpdaterJson: false
          releaseBody: |
            Clipboard command palette for MSP/field techs. Copy, never execute remotely.

            ### Downloads (Windows 10/11 x64)
            - **NSIS installer** (recommended): `Command Center_*_x64-setup.exe`
            - **MSI** for workplace installers
            - **Portable** `command-center.exe` and/or the portable zip

            If Windows says “Windows protected your PC”, choose **More info → Run anyway**.

            Free forever. No account. Offline OK.
      - name: Zip portable exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/command-center.exe"
          if (Test-Path $exe) {
            New-Item -ItemType Directory -Force -Path portable-exe | Out-Null
            Copy-Item $exe portable-exe/command-center.exe
            Set-Content -Path portable-exe/README.txt -Value @(
              'Command Center — portable .exe',
              'Double-click command-center.exe. Clipboard only; never executes remotely.',
              'If Windows says "Windows protected your PC", choose More info -> Run anyway.'
            )
            Compress-Archive -Path portable-exe\* -DestinationPath Command-Center-portable-win64.zip -Force
          }
      - name: Portable web zip
        run: npm run package:portable
      - name: Attach portable zip
        if: startsWith(env.RELEASE_TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            Command-Center-portable-win64.zip
            src-tauri/target/release/command-center.exe
            dist-portable/Command-Center-0.1.0-portable-win64.zip
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: command-center-windows
          path: |
            src-tauri/target/release/command-center.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            Command-Center-portable-win64.zip
            dist-portable/Command-Center-0.1.0-portable-win64.zip
