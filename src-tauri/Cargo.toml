[package]
name = "command-center"
version = "0.2.0"
description = "Command Center — clipboard command palette for remote work"
authors = ["Command Center"]
edition = "2021"
license = "MIT"

[lib]
name = "command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
